name: Build Check
# Modified by CeraLive 2026-09-13: retain real sanitizer coverage under docs-only gating.

# `push` carries a positive branch/tag selector on purpose: with a bare `push:`
# every pull-request-branch push would run this workflow twice, and
# `concurrency:` does NOT dedupe it — refs/heads/<branch> and refs/pull/N/merge
# hash to different groups, so the trigger filter is the fix.
on:
  push:
    branches: [main, "release/**"]
    tags: ["*"]
  pull_request:
    branches: [main, "release/**", "integration/**"]
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}

permissions:
  contents: read

# A container job's default shell is `sh -e`, and dash has no `pipefail`. Every
# `run:` block here is written as bash; say so once rather than degrading each
# one to POSIX sh.
defaults:
  run:
    shell: bash

jobs:
  # Change detection. A documentation-only pull request has nothing for the
  # build below to prove, so it skips rather than run to a vacuous green.
  #
  # The gating is a JOB-LEVEL `if:`, never a trigger-level `paths:`/
  # `paths-ignore:`. A trigger filter stops the workflow from starting at all,
  # and a required check that never reports blocks a merge instead of passing
  # it — which is what the always-run summary job at the bottom exists to avoid.
  #
  # `code` is an EXCLUSION list — "every changed file is NOT documentation" —
  # so this step carries `predicate-quantifier: 'every'`. The quantifier is a
  # property of the STEP, not of a filter: a positive OR list must live in its
  # own step under the default `some`, or `every` would turn it into an AND that
  # no single file can satisfy.
  changes:
    name: Change detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # The filter runs on pull requests only. On a push or a tag the step is
      # skipped and the fallback keeps `code` true, so those events keep their
      # full coverage.
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'

  resolve-suite:
    name: Resolve device target suite
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    outputs:
      suite: ${{ steps.read.outputs.suite }}
      secondary_suite: ${{ steps.read.outputs.secondary_suite }}
      arch: ${{ steps.read.outputs.arch }}
      triplet: ${{ steps.read.outputs.triplet }}
      glibc_floor: ${{ steps.read.outputs.glibc_floor }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The values reach the build job as OUTPUTS, never `$GITHUB_ENV`. GitHub
      # selects a job's `container:` before that job's first step runs, so a
      # same-job export is structurally too late to name the image — which is
      # exactly what the build matrix needs it for.
      - name: Read ci/target-suite.env
        id: read
        run: |
          set -euo pipefail
          # shellcheck source=ci/target-suite.env
          source ci/target-suite.env
          for key in TARGET_SUITE SECONDARY_SUITE TARGET_ARCH TARGET_TRIPLET GLIBC_FLOOR; do
            if [ -z "${!key:-}" ]; then
              echo "ERROR: $key is not declared in ci/target-suite.env" >&2
              exit 1
            fi
          done
          {
            echo "suite=${TARGET_SUITE}"
            echo "secondary_suite=${SECONDARY_SUITE}"
            echo "arch=${TARGET_ARCH}"
            echo "triplet=${TARGET_TRIPLET}"
            echo "glibc_floor=${GLIBC_FLOOR}"
          } >> "$GITHUB_OUTPUT"
          echo "target ${TARGET_SUITE} · secondary ${SECONDARY_SUITE} · ${TARGET_ARCH} · glibc floor ${GLIBC_FLOOR}"

      # Without this, flipping TARGET_SUITE to a suite the matrix does not build
      # would silently retire the ABI floor gate: its step condition would match
      # no leg and the workflow would stay green having checked nothing.
      - name: Assert both declared suites are matrix legs
        run: |
          set -euo pipefail
          for suite in '${{ steps.read.outputs.suite }}' '${{ steps.read.outputs.secondary_suite }}'; do
            if ! grep -qE "^ +- suite: ${suite}\$" .github/workflows/build-check.yml; then
              echo "ERROR: ci/target-suite.env names ${suite}, but the build matrix has" >&2
              echo "       no '- suite: ${suite}' leg, so nothing would be built for it." >&2
              exit 1
            fi
          done
          echo "matrix covers ${{ steps.read.outputs.suite }} and ${{ steps.read.outputs.secondary_suite }}"

  build:
    name: ${{ matrix.suite }} · arm64
    needs: [changes, resolve-suite]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:${{ matrix.suite }}-slim
    strategy:
      # Both legs always report. A secondary-suite failure is a real portability
      # problem and must be seen, not hidden behind a cancelled sibling.
      fail-fast: false
      matrix:
        include:
          - suite: bookworm
          - suite: trixie
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    steps:
      # The slim image has no git, and `actions/checkout` silently degrades to a
      # history-less REST tarball without it. Base tooling therefore installs
      # BEFORE the checkout, not after.
      - name: Install base tooling
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git

      # fetch-depth 0 is load-bearing. packaging/build-deb.sh derives
      # SOURCE_DATE_EPOCH from the last commit that touched a PACKAGED INPUT, and
      # a depth-1 checkout answers that query with nothing whenever HEAD happens
      # to be a docs or test commit — which is most of them.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.suite }}-arm64-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.suite }}-arm64-

      # ONE step, on purpose. Everything this leg does lives in the script, so
      # `docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src
      # debian:${{ matrix.suite }}-slim bash ci/build-check-steps.sh` reproduces
      # it exactly, without a pull request and without this file.
      - name: Build check (deps · contract · meson · test · package)
        run: bash ci/build-check-steps.sh

      - name: Export unit-pure, unit-session, goldens and uapi-parity results
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def test_name(name):
              return name.rsplit(' / ', 1)[-1].rsplit(':', 1)[-1]
          for raw, expected in [
              ('librga / unit-pure', 'unit-pure'),
              ('librga:uapi / uapi-parity', 'uapi-parity'),
              ('librga:goldens', 'goldens'),
              ('unit-session', 'unit-session'),
          ]:
              if test_name(raw) != expected:
                  raise SystemExit(f'Meson result-name regression: {raw}')
          results = [json.loads(line) for line in Path('build/meson-logs/testlog.json').read_text().splitlines()]
          Path('build/test-results.json').write_text(json.dumps([
              {'name': test_name(row['name']), 'result': row['result']}
              for row in results
          ]))
          PY

      - name: Upload suite test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.suite }}
          path: build/test-results.json
          if-no-files-found: error

      # Enforced only on the TARGET leg, and the condition reads the declared
      # suite rather than a literal. The secondary leg builds against an OLDER
      # glibc by construction, so its imports say nothing about the device.
      #
      # This gates the unstripped library in the meson tree; ci/build-check-steps.sh
      # has already gated the stripped one the runtime package ships. They are two
      # different binaries and both are worth refusing.
      - name: ABI floor gate (target suite only)
        if: matrix.suite == needs.resolve-suite.outputs.suite
        run: bash ci/check-abi-floors.sh build/librga.so.2.1.0

      - name: Note the secondary-suite leg
        if: matrix.suite != needs.resolve-suite.outputs.suite
        run: |
          echo "${{ matrix.suite }} is the secondary suite, not the device target"
          echo "(${{ needs.resolve-suite.outputs.suite }}). It proves the source still"
          echo "configures, compiles and passes its tests on an older toolchain. The"
          echo ".deb and the ABI floors are properties of the target suite and are"
          echo "checked on that leg."

      # The R0/R1 release branches consume these: the board gate installs the
      # exact archives a build-check run produced rather than rebuilding them.
      # Only the target leg produces a shippable package.
      - name: Upload the built packages
        if: matrix.suite == needs.resolve-suite.outputs.suite
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

      - name: Save ccache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.suite }}-arm64-${{ github.sha }}

      - name: Build summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.suite }} · arm64"
            echo
            echo "- device target suite: \`${{ needs.resolve-suite.outputs.suite }}\` (GLIBC floor \`${{ needs.resolve-suite.outputs.glibc_floor }}\`)"
            echo "- ABI floor gate: ${{ matrix.suite == needs.resolve-suite.outputs.suite && 'enforced' || 'not applicable (secondary suite)' }}"
            echo "- packaging: ${{ matrix.suite == needs.resolve-suite.outputs.suite && 'librga2-ceralive + librga-ceralive-dev built and contract-checked' || 'not applicable (secondary suite)' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  test-results:
    name: ${{ matrix.group }} · ${{ matrix.suite }} results
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        group: [unit, goldens, uapi-parity]
    steps:
      - name: Download suite test results
        uses: actions/download-artifact@v8
        with:
          name: test-results-${{ matrix.suite }}
      - name: Require every test in the group to have run successfully
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          expected = {
              'unit': {'unit-pure': 1, 'unit-session': 1},
              'goldens': {'goldens': 8},
              'uapi-parity': {'uapi-parity': 1, 'uapi-parity-stubs': 1},
          }[os.environ['GROUP']]
          results = json.loads(Path('test-results.json').read_text())
          for name, count in expected.items():
              rows = [row for row in results if row['name'] == name]
              if len(rows) != count or any(row['result'] != 'OK' for row in rows):
                  raise SystemExit(f'{name}: expected {count} OK results, got {rows}')
              print(f'{name}: {count} OK')
          PY

  analyzer:
    name: GCC -fanalyzer (required)
    needs: [changes, resolve-suite]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:${{ needs.resolve-suite.outputs.suite }}-slim
    env:
      ANALYZER_STRICT: '1'
    steps:
      - name: Install base tooling
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git g++ meson ninja-build pkg-config python3

      - name: Checkout code
        uses: actions/checkout@v7

      # ONE step, on purpose, for the same reason the build leg is one step:
      # `docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src
      # debian:trixie-slim bash scripts/run-analyzer.sh` reproduces it exactly.
      #
      # Normal builds now expose warnings too; analyzer adds -fanalyzer.
      - name: Run the analyzer and reconcile against docs/ANALYZER-TRIAGE.md
        run: bash scripts/run-analyzer.sh

      - name: Analyzer summary
        if: always()
        run: |
          set -euo pipefail
          count=0
          if [ -f test-results/analyzer-hits.txt ]; then
            count="$(wc -l < test-results/analyzer-hits.txt)"
          fi
          {
            echo "## GCC -fanalyzer — REQUIRED"
            echo
            echo "This job gates a merge. It reports what the GCC static"
            echo "analyzer sees in the library sources. Every finding"
            echo "is dispositioned in \`docs/ANALYZER-TRIAGE.md\`; an untriaged one"
            echo "is printed above."
            echo
            echo "- unique \`-Wanalyzer-*\` hits: \`${count}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the analyzer log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analyzer-log
          path: test-results/
          if-no-files-found: warn

  werror:
    name: Werror · fork-owned context and tests · arm64
    needs: [changes, resolve-suite]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:${{ needs.resolve-suite.outputs.suite }}-slim
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: werror-${{ runner.arch }}-${{ github.sha }}
          restore-keys: werror-${{ runner.arch }}-
      - name: Compile owned TUs without suppressions and prove warning rejection
        run: bash ci/werror-steps.sh
      - uses: actions/cache/save@v6
        if: github.event_name != 'pull_request'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: werror-${{ runner.arch }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: werror-logs
          path: test-results/werror/*.txt
          if-no-files-found: error

  sanitizers:
    name: ASan/UBSan + TSan (host shim)
    needs: [changes, resolve-suite]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:${{ needs.resolve-suite.outputs.suite }}-slim
    steps:
      - name: Install base tooling
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git

      - name: Checkout code
        uses: actions/checkout@v7

      # ONE step, on purpose. `docker run --rm --platform linux/arm64
      # -v "$PWD":/src -w /src debian:trixie-slim bash ci/sanitizers-steps.sh`
      # reproduces this leg exactly, without a pull request and without this file.
      - name: Sanitizers (build · canaries · meson test)
        run: bash ci/sanitizers-steps.sh

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-logs
          path: test-results/
          if-no-files-found: warn

      # HOST SHIM ONLY, and the summary says so on every run. A sanitizer report
      # from this job describes librga's behaviour against the shim's model of
      # the driver. It is never evidence about the RGA hardware, and no board
      # drill or fix-audit row may cite it as such.
      - name: Sanitizer summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Sanitizers — host shim only"
            echo
            if [ -f test-results/sanitizers-summary.txt ]; then
              echo '```'
              cat test-results/sanitizers-summary.txt
              echo '```'
            else
              echo "The run did not reach its summary; read the job log."
            fi
            echo
            echo "No board sanitizer coverage is claimed. TSan is host-only"
            echo "permanently — it cannot be statically linked, so there is no"
            echo "board-side equivalent."
          } >> "$GITHUB_STEP_SUMMARY"

  abi:
    name: ABI · R1 vs R0 · matched debug builds
    needs: [changes, resolve-suite]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:${{ needs.resolve-suite.outputs.suite }}-slim
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    steps:
      - name: Install ABI tooling before full-history checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git g++ ccache meson ninja-build pkg-config python3 abigail-tools binutils
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: abi-${{ runner.arch }}-${{ github.sha }}
          restore-keys: abi-${{ runner.arch }}-
      - name: Compare matched -g -O2 R0 and R1, rejecting incompatibilities
        run: bash ci/abi-steps.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: abi-evidence
          path: |
            test-results/abi/abidiff.txt
            test-results/abi/build-*/compile_commands.json
            test-results/abi/build-*/librga.so.2.1.0
          if-no-files-found: error

  reproducible:
    name: Reproducible · two complete arm64 package builds
    needs: [changes, resolve-suite]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:${{ needs.resolve-suite.outputs.suite }}-slim
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    steps:
      - name: Install packaging tooling before full-history checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git g++ ccache meson ninja-build pkg-config python3 dpkg-dev binutils
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: repro-${{ runner.arch }}-${{ github.sha }}
          restore-keys: repro-${{ runner.arch }}-
      - name: Build twice with an explicit fixed SOURCE_DATE_EPOCH and compare bytes
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
          mkdir -p test-results/repro-tmp
          export TMPDIR="$PWD/test-results/repro-tmp"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          printf 'SOURCE_DATE_EPOCH=%s\n' "$SOURCE_DATE_EPOCH" | tee test-results/reproducible.txt
          bash packaging/package-contract.sh --repro 2>&1 | tee -a test-results/reproducible.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reproducibility-evidence
          path: test-results/reproducible.txt
          if-no-files-found: error

  mtune-measurement:
    name: Cortex-A76 · measurement only, not an acceptance gate
    needs: [changes, resolve-suite]
    if: needs.changes.outputs.code == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:${{ needs.resolve-suite.outputs.suite }}-slim
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    steps:
      - uses: actions/checkout@v7
      - name: Install measurement tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++ ccache meson ninja-build pkg-config python3 binutils
      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: mtune-${{ runner.arch }}-${{ github.sha }}
          restore-keys: mtune-${{ runner.arch }}-
      - name: Prepare unpackaged H4 variants and record size, never performance pass/fail
        run: bash ci/mtune-measurement.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mtune-measurement-only
          path: |
            test-results/mtune/measurement.txt
            test-results/mtune/*/librga.so.2.1.0
          if-no-files-found: warn

  # The one check a branch-protection rule can require. It runs on every event,
  # including a docs-only pull request where every gate above skipped, and goes
  # red whenever a dependency failed or was cancelled. Skips are allowed only
  # when change detection explicitly classified the diff as documentation-only.
  #
  build-check-summary:
    name: Build Check summary
    if: always()
    needs:
      - changes
      - resolve-suite
      - build
      - test-results
      - sanitizers
      - werror
      - analyzer
      - abi
      - reproducible
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          echo "dependency results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
                failure|cancelled)
                  echo "::error::a required job reported '${result}'"
                  exit 1
                  ;;
                skipped)
                  if [ "${CODE_CHANGED}" != 'false' ]; then
                    echo "::error::a required job skipped without a docs-only verdict"
                    exit 1
                  fi
                  ;;
            esac
          done
          echo "every dependency succeeded or had an explicit docs-only skip"
